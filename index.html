<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyerae's Portfolio</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div id="app">
      <main id="viewerShell">
        <iframe id="portfolioFrame" title="Hyerae's Portfolio"></iframe>
        <div id="editorToolbar" class="editor-toolbar" hidden>
          <div class="editor-status-wrap">
            <strong>Portfolio Editor</strong
            ><span id="editorStatus">편집 준비 중</span>
          </div>
          <button id="signInBtn" type="button">로그인</button
          ><button id="toggleEditBtn" type="button">편집 시작</button
          ><button id="publishBtn" type="button" class="primary">
            변경사항 게시</button
          ><button id="discardBtn" type="button">임시저장 삭제</button>
        </div>
        <div id="toast" class="toast" hidden></div>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
